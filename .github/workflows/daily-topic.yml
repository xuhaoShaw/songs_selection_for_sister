name: daily-topic-analysis

on:
  schedule:
    - cron: "47 21 * * *"          # UTC 21:47 = 北京时间次日 05:47
  workflow_dispatch: {}            # 允许在网页上手动触发

permissions:
  contents: write                  # 将选曲历史持久化到独立分支

concurrency:
  group: daily-topic-analysis
  cancel-in-progress: false        # 串行读取、推送、保存历史

jobs:
  run:
    runs-on: ubuntu-latest
    # 模型名只在这里定义一次，预检与实际分析共用，避免改了一处漏另一处。
    env:
      MODELVERSE_API_KEY: ${{ secrets.MODELVERSE_API_KEY }}
      LLM_BASE_URL: https://api.modelverse.cn/v1
      LLM_MODEL: deepseek-v4.1-flash
      COVER_MODEL: doubao-seedream-5-0-pro-260628
      HISTORY_FILE: song-history.json
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test song selection and history sync
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test-song-history.cjs

      - name: Restore song history
        id: history
        uses: actions/github-script@v7
        with:
          script: |
            const sync = require('./.github/scripts/song-history.cjs');
            await sync({github, context, core, mode: 'restore'});

      - name: Preflight ModelVerse credentials
        run: python tools/check_modelverse_key.py

      - name: Run daily topic analysis
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          COVER_ENABLED: "true"
        run: python daily_topic_analysis.py

      - name: Save song history
        if: ${{ always() && steps.history.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          HISTORY_SHA: ${{ steps.history.outputs.sha }}
        with:
          script: |
            const sync = require('./.github/scripts/song-history.cjs');
            await sync({github, context, core, mode: 'save'});

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-report
          path: |
            daily-analysis/*.html
            daily-analysis/*.png
            daily-analysis/push-failed.txt
            song-history.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "未配置 FEISHU_WEBHOOK，跳过失败通知"
            exit 0
          fi
          curl -sS -m 20 -X POST "$FEISHU_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"每日选题任务失败，运行日志：$RUN_URL\"}}" > /dev/null
