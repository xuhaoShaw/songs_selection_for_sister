name: daily-topic-analysis

on:
  schedule:
    - cron: "47 21 * * *"          # UTC 21:47 = 北京时间次日 05:47
  workflow_dispatch: {}            # 允许在网页上手动触发

permissions:
  contents: write                  # 将选曲历史持久化到独立分支

concurrency:
  group: daily-topic-analysis
  cancel-in-progress: false        # 串行读取、推送、保存历史

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test song selection and history sync
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test-song-history.cjs

      - name: Restore song history
        id: history
        uses: actions/github-script@v7
        with:
          script: |
            const sync = require('./.github/scripts/song-history.cjs');
            await sync({github, context, core, mode: 'restore'});

      - name: Run daily topic analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          LLM_MODEL: deepseek-v4-pro
          ENABLE_SEARCH: "1"
          HISTORY_FILE: song-history.json
        run: python daily_topic_analysis.py

      - name: Save song history
        if: ${{ always() && steps.history.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          HISTORY_SHA: ${{ steps.history.outputs.sha }}
        with:
          script: |
            const sync = require('./.github/scripts/song-history.cjs');
            await sync({github, context, core, mode: 'save'});

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-report
          path: |
            daily-analysis/*.html
            daily-analysis/push-failed.txt
            song-history.json
          if-no-files-found: ignore
          retention-days: 30
