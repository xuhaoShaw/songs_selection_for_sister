name: preview-xiaohongshu-cover

on:
  workflow_dispatch:
    inputs:
      song:
        description: "歌曲名"
        required: true
        default: "如愿"
        type: string
      artist:
        description: "原唱"
        required: true
        default: "王菲"
        type: string
      headline:
        description: "封面短句"
        required: true
        default: "想念有回声"
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate sample cover without sending Feishu messages
        env:
          MODELVERSE_API_KEY: ${{ secrets.MODELVERSE_API_KEY }}
          LLM_BASE_URL: https://api.modelverse.cn/v1
          COVER_SONG: ${{ inputs.song }}
          COVER_ARTIST: ${{ inputs.artist }}
          COVER_HEADLINE: ${{ inputs.headline }}
        run: |
          python - <<'PY'
          import datetime
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import daily_topic_analysis as app
          from cover_image import generate_cover

          song = {
              "song": os.environ["COVER_SONG"],
              "artist": os.environ["COVER_ARTIST"],
              "reason": "温暖的家国情感与灯火意象，适合女声用克制而有力量的方式演唱。",
              "title": "把灯火唱给你听",
              "tags": ["#女声翻唱", "#清唱"],
              "is_theme": False,
              "theme_reason": "",
          }
          data = {
              "songs": [song],
              "lead": {"song": song["song"], "artist": song["artist"], "reason": song["reason"]},
              "lead_details": {"cover_headline": os.environ["COVER_HEADLINE"]},
              "holiday_context": {},
              "action": "测试封面排版。",
          }
          today = datetime.datetime.now(ZoneInfo("Asia/Shanghai")).date()
          folder = Path("daily-analysis/cover-preview")
          cover = generate_cover(
              data, str(folder), today, os.environ["MODELVERSE_API_KEY"],
              os.environ["LLM_BASE_URL"],
          )
          data["cover"] = cover
          (folder / "preview.html").write_text(app.render_html(data), encoding="utf-8")
          print(f"Generated preview for {cover['song']}: {cover['path']}")
          PY

      - name: Upload cover preview
        uses: actions/upload-artifact@v4
        with:
          name: xiaohongshu-cover-preview
          path: daily-analysis/cover-preview/*
          if-no-files-found: error
          retention-days: 7
